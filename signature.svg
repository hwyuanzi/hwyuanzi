<svg width="700" height="76" viewBox="0 0 700 76" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Weaving silicon dreams in the city that never sleeps.</title>
  <desc id="desc">A Claude-inspired cream and terracotta liquid-glass signature.</desc>
  <defs>
    <style>
      @keyframes drift { 0%,100% { transform:translateX(0); opacity:.72; } 50% { transform:translateX(17px); opacity:1; } }
      @keyframes twinkle { 0%,100% { opacity:.4; transform:scale(.86); } 50% { opacity:1; transform:scale(1.08); } }
      .drift { animation:drift 12s ease-in-out infinite; }.twinkle { animation:twinkle 3.2s ease-in-out infinite; transform-origin:center; }
      @media (prefers-reduced-motion: reduce) { .drift,.twinkle { animation:none; } }
    </style>
    <linearGradient id="panel" x1="12" y1="10" x2="688" y2="66" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFDFC" stop-opacity=".86"/><stop offset=".52" stop-color="#F8F3EC" stop-opacity=".72"/><stop offset="1" stop-color="#F1DED5" stop-opacity=".80"/></linearGradient>
    <linearGradient id="border" x1="22" y1="8" x2="682" y2="70" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset=".46" stop-color="#FFFFFF" stop-opacity=".64"/><stop offset="1" stop-color="#D97757" stop-opacity=".70"/></linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(574 20) rotate(166) scale(275 90)"><stop stop-color="#D97757" stop-opacity=".50"/><stop offset=".45" stop-color="#E8A58C" stop-opacity=".18"/><stop offset="1" stop-color="#E8A58C" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="0" y="0" width="700" height="76" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#8C6656" flood-opacity=".16"/></filter>
    <clipPath id="clip"><rect x="10" y="10" width="680" height="56" rx="28"/></clipPath>
  </defs>
  <g filter="url(#shadow)"><rect x="10" y="10" width="680" height="56" rx="28" fill="url(#panel)" stroke="url(#border)"/><rect x="12" y="12" width="676" height="52" rx="26" stroke="#FFFFFF" stroke-opacity=".62"/></g>
  <g clip-path="url(#clip)"><g class="drift"><ellipse cx="564" cy="19" rx="230" ry="66" fill="url(#glow)"/></g><path d="M38 11H662" stroke="#FFFFFF" stroke-opacity=".78"/></g>
  <g class="twinkle" transform="translate(42 38)" aria-hidden="true"><path d="M0-6C.8-1.8 1.8-.8 6 0 1.8.8.8 1.8 0 6-.8 1.8-1.8.8-6 0-1.8-.8-.8-1.8 0-6Z" fill="#D97757"/></g>
  <text x="345" y="43" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" letter-spacing=".1" fill="#2D2926">Weaving silicon dreams <tspan fill="#B45D40">in the city that never sleeps.</tspan></text>
  <g transform="translate(630 25)"><rect width="42" height="26" rx="13" fill="#D97757" fill-opacity=".13" stroke="#D97757" stroke-opacity=".36"/><text x="21" y="17" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1.15" fill="#9E4E35">NYC</text></g>
</svg>
