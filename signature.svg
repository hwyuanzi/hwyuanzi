<svg width="700" height="76" viewBox="0 0 700 76" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Weaving silicon dreams in the city that never sleeps.</title>
  <desc id="desc">A warm liquid-glass signature inspired by New York City.</desc>
  <defs>
    <style>
      @keyframes drift { 0%,100% { transform:translateX(0); opacity:.85; } 50% { transform:translateX(16px); opacity:1; } }
      @keyframes twinkle { 0%,100% { opacity:.38; transform:scale(.86); } 50% { opacity:1; transform:scale(1.08); } }
      .drift { animation:drift 12s ease-in-out infinite; }
      .twinkle { animation:twinkle 3.2s ease-in-out infinite; transform-origin:center; }
      @media (prefers-reduced-motion: reduce) { .drift,.twinkle { animation:none; } }
    </style>
    <linearGradient id="border" x1="24" y1="10" x2="676" y2="68" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF3E8" stop-opacity="0.34"/>
      <stop offset="0.48" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0.48"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(575 22) rotate(164) scale(268 85)">
      <stop stop-color="#D97757" stop-opacity="0.68"/>
      <stop offset="0.42" stop-color="#A65039" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect x="10" y="10" width="680" height="56" rx="28"/></clipPath>
  </defs>

  <rect x="14" y="16" width="672" height="52" rx="26" fill="#080706" fill-opacity="0.28"/>
  <rect x="10" y="10" width="680" height="56" rx="28" fill="#1A1715" stroke="url(#border)"/>
  <rect x="12" y="12" width="676" height="52" rx="26" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <g clip-path="url(#clip)">
    <g class="drift"><ellipse cx="565" cy="20" rx="225" ry="66" fill="url(#glow)"/></g>
    <path d="M39 11H661" stroke="#FFFFFF" stroke-opacity="0.13"/>
    <circle cx="170" cy="70" r="85" fill="#C7B49E" fill-opacity="0.055"/>
  </g>

  <g class="twinkle" transform="translate(42 38)" aria-hidden="true">
    <path d="M0-6C.8-1.8 1.8-.8 6 0 1.8.8.8 1.8 0 6-.8 1.8-1.8.8-6 0-1.8-.8-.8-1.8 0-6Z" fill="#D97757"/>
  </g>
  <text x="345" y="43" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" letter-spacing="0.15" fill="#F2E9E0">
    Weaving silicon dreams <tspan fill="#E4A487">in the city that never sleeps.</tspan>
  </text>
  <g transform="translate(629 25)">
    <rect width="42" height="26" rx="13" fill="#FFF7EE" fill-opacity="0.07" stroke="#FFF7EE" stroke-opacity="0.16"/>
    <text x="21" y="17" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="9" font-weight="600" letter-spacing="1.2" fill="#F0E5DB">NYC</text>
  </g>
</svg>
