<svg width="850" height="450" viewBox="0 0 850 450" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hollan Yuan — Computer Science, Data Science, and Physics at NYU</title>
  <desc id="desc">A cream, terracotta, and dark-cocoa liquid-glass profile card inspired by Claude and macOS.</desc>
  <defs>
    <style>
      .sans { font-family:-apple-system,BlinkMacSystem,"SF Pro Display","Segoe UI",Helvetica,Arial,sans-serif; }
      .mono { font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace; }
      .title { font-family:-apple-system,BlinkMacSystem,"SF Pro Display","Segoe UI",sans-serif; font-size:51px; font-weight:720; letter-spacing:-2.2px; fill:#2D2926; text-anchor:middle; }
      .subtitle { font-family:-apple-system,BlinkMacSystem,"SF Pro Text","Segoe UI",sans-serif; font-size:16px; font-weight:450; letter-spacing:.2px; fill:#655D57; text-anchor:middle; }
      .eyebrow { font-family:"SFMono-Regular",Consolas,monospace; font-size:9px; font-weight:600; letter-spacing:1.45px; fill:#786E67; text-anchor:middle; }
      .quote-text { font-family:Georgia,"Times New Roman",serif; font-size:16px; font-style:italic; letter-spacing:.08px; fill:#342F2C; text-anchor:middle; }
      .quote-author { font-family:"SFMono-Regular",Consolas,monospace; font-size:9px; font-weight:600; letter-spacing:1.4px; fill:#8A6558; text-anchor:middle; }
      @keyframes breathe { 0%,100% { transform:scale(1); opacity:.72 } 50% { transform:scale(1.06); opacity:1 } }
      @keyframes drift { 0%,100% { transform:translate(0,0) } 50% { transform:translate(15px,-9px) } }
      @keyframes sheen { 0%,22% { transform:translateX(-760px) skewX(-18deg); opacity:0 } 42% { opacity:.42 } 64%,100% { transform:translateX(760px) skewX(-18deg); opacity:0 } }
      @keyframes quoteCycle {
        0% { opacity:0; transform:translateY(8px); }
        5% { opacity:1; transform:translateY(0); }
        82% { opacity:1; transform:translateY(0); }
        96%,100% { opacity:0; transform:translateY(-7px); }
      }
      .orb-a { animation:breathe 11s ease-in-out infinite; transform-origin:170px 335px; }
      .orb-b { animation:drift 14s ease-in-out infinite; }
      .sheen { animation:sheen 13s ease-in-out infinite; }
      .quote-container { animation:quoteCycle 168s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .orb-a,.orb-b,.sheen,.quote-container { animation:none; } .quote-container:not([data-quote="1"]) { display:none; } }
    </style>
    <linearGradient id="background" x1="74" y1="32" x2="802" y2="434" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F1E8"/>
      <stop offset=".46" stop-color="#EEE5D9"/>
      <stop offset="1" stop-color="#E6D8CA"/>
    </linearGradient>
    <radialGradient id="terracotta" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(700 72) rotate(142) scale(340 250)">
      <stop stop-color="#D97757" stop-opacity=".74"/>
      <stop offset=".52" stop-color="#A65039" stop-opacity=".18"/>
      <stop offset="1" stop-color="#A65039" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="creamGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(106 414) rotate(-42) scale(300 205)">
      <stop stop-color="#FFFDFC" stop-opacity=".82"/>
      <stop offset="1" stop-color="#F8E9DF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="133" y1="82" x2="713" y2="374" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".72"/>
      <stop offset=".42" stop-color="#FFFDFC" stop-opacity=".42"/>
      <stop offset="1" stop-color="#D97757" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="glassBorder" x1="120" y1="76" x2="728" y2="386" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".96"/>
      <stop offset=".48" stop-color="#FFFFFF" stop-opacity=".42"/>
      <stop offset="1" stop-color="#D97757" stop-opacity=".66"/>
    </linearGradient>
    <linearGradient id="quoteGlass" x1="172" y1="309" x2="681" y2="391" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".58"/>
      <stop offset=".55" stop-color="#FFFDFC" stop-opacity=".34"/>
      <stop offset="1" stop-color="#D97757" stop-opacity=".14"/>
    </linearGradient>
    <filter id="shadow" x="55" y="42" width="740" height="370" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#8C6656" flood-opacity=".22"/>
    </filter>
    <filter id="soft" x="-100" y="-100" width="1050" height="650" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="44"/>
    </filter>
    <clipPath id="cardClip"><rect x="92" y="58" width="666" height="334" rx="38"/></clipPath>
  </defs>

  <rect width="850" height="450" rx="24" fill="url(#background)"/>
  <g filter="url(#soft)">
    <ellipse class="orb-a" cx="112" cy="398" rx="228" ry="128" fill="url(#creamGlow)"/>
    <ellipse class="orb-b" cx="728" cy="62" rx="286" ry="196" fill="url(#terracotta)"/>
  </g>

  <g opacity=".16">
    <path d="M46 116C188 46 292 72 408 38C541 -1 664 20 806 100" stroke="#FFFFFF" stroke-width=".7"/>
    <path d="M34 388C194 320 290 406 428 376C562 347 679 300 820 342" stroke="#C96647" stroke-width=".75"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="92" y="58" width="666" height="334" rx="38" fill="#FFFDFC" fill-opacity=".54"/>
    <rect x="92.75" y="58.75" width="664.5" height="332.5" rx="37.25" fill="url(#glass)" stroke="url(#glassBorder)" stroke-width="1.5"/>
    <rect x="96" y="62" width="658" height="326" rx="34" stroke="#FFFFFF" stroke-opacity=".72"/>
  </g>

  <g clip-path="url(#cardClip)">
    <g class="sheen">
      <rect x="262" y="22" width="124" height="414" fill="#FFFFFF" fill-opacity=".34"/>
    </g>
    <ellipse cx="606" cy="83" rx="200" ry="62" fill="#FFFFFF" fill-opacity=".28"/>
  </g>

  <g aria-hidden="true">
    <circle cx="126" cy="91" r="5.5" fill="#D97757"/>
    <circle cx="145" cy="91" r="5.5" fill="#E8A58C"/>
    <circle cx="164" cy="91" r="5.5" fill="#2D2926" fill-opacity=".72"/>
    <text x="712" y="95" class="mono" font-size="8" letter-spacing="1.3" fill="#766B64" text-anchor="end">NYC / NYU</text>
  </g>

  <text x="425" y="166" class="title">Hollan Yuan</text>
  <text x="425" y="198" class="subtitle">Computer Science · Data Science · Physics @ NYU</text>

  <g transform="translate(425 236)">
    <rect x="-242" y="-17" width="484" height="34" rx="17" fill="#FFFFFF" fill-opacity=".42" stroke="#FFFFFF" stroke-opacity=".78"/>
    <text x="0" y="3" class="eyebrow">
      <tspan fill="#B85C40">SOFTWARE</tspan><tspan dx="10">·</tspan>
      <tspan dx="10" fill="#6E625B">DATA</tspan><tspan dx="10">·</tspan>
      <tspan dx="10" fill="#D97757">AI</tspan><tspan dx="10">·</tspan>
      <tspan dx="10" fill="#B85C40">SYSTEMS</tspan><tspan dx="10">·</tspan>
      <tspan dx="10" fill="#6E625B">DISCOVERY</tspan>
    </text>
  </g>

  <g>
    <rect x="139" y="296" width="572" height="91" rx="23" fill="url(#quoteGlass)" stroke="#FFFFFF" stroke-opacity=".84"/>
    <path d="M164 297H665" stroke="#FFFFFF" stroke-opacity=".84"/>
    <circle cx="166" cy="319" r="3" fill="#D97757"/>
    <text x="178" y="322" class="mono" font-size="8" letter-spacing="1.3" fill="#8A6558">CURRENT FREQUENCY</text>
    <!-- QUOTES_START -->
    <g class="quote-container" data-quote="1" opacity="1" style="animation-delay:0s">
      <text x="425" y="342" class="quote-text">“The important thing is to never stop questioning.”</text>
      <text x="425" y="371" class="quote-author">— Albert Einstein</text>
    </g>
    <g class="quote-container" data-quote="2" opacity="0" style="animation-delay:7s">
      <text x="425" y="342" class="quote-text">“The universe is under no obligation to make sense to you.”</text>
      <text x="425" y="371" class="quote-author">— Neil deGrasse Tyson</text>
    </g>
    <g class="quote-container" data-quote="3" opacity="0" style="animation-delay:14s">
      <text x="425" y="342" class="quote-text">“Simplicity is the soul of efficiency.”</text>
      <text x="425" y="371" class="quote-author">— Austin Freeman</text>
    </g>
    <g class="quote-container" data-quote="4" opacity="0" style="animation-delay:21s">
      <text x="425" y="342" class="quote-text">“The important thing is to never stop questioning.”</text>
      <text x="425" y="371" class="quote-author">— Albert Einstein</text>
    </g>
    <g class="quote-container" data-quote="5" opacity="0" style="animation-delay:28s">
      <text x="425" y="342" class="quote-text">“The most dangerous phrase is: we've always done it this way.”</text>
      <text x="425" y="371" class="quote-author">— Grace Hopper</text>
    </g>
    <g class="quote-container" data-quote="6" opacity="0" style="animation-delay:35s">
      <text x="425" y="342" class="quote-text">“Stay hungry, stay foolish.”</text>
      <text x="425" y="371" class="quote-author">— Steve Jobs</text>
    </g>
    <g class="quote-container" data-quote="7" opacity="0" style="animation-delay:42s">
      <text x="425" y="342" class="quote-text">“Premature optimization is the root of all evil.”</text>
      <text x="425" y="371" class="quote-author">— Donald Knuth</text>
    </g>
    <g class="quote-container" data-quote="8" opacity="0" style="animation-delay:49s">
      <text x="425" y="342" class="quote-text">“Science is a way of thinking much more than a body of knowledge.”</text>
      <text x="425" y="371" class="quote-author">— Carl Sagan</text>
    </g>
    <g class="quote-container" data-quote="9" opacity="0" style="animation-delay:56s">
      <text x="425" y="342" class="quote-text">“The future depends on what you do today.”</text>
      <text x="425" y="371" class="quote-author">— Mahatma Gandhi</text>
    </g>
    <g class="quote-container" data-quote="10" opacity="0" style="animation-delay:63s">
      <text x="425" y="342" class="quote-text">“We are what we repeatedly do.”</text>
      <text x="425" y="371" class="quote-author">— Will Durant</text>
    </g>
    <g class="quote-container" data-quote="11" opacity="0" style="animation-delay:70s">
      <text x="425" y="342" class="quote-text">“Not all those who wander are lost.”</text>
      <text x="425" y="371" class="quote-author">— J. R. R. Tolkien</text>
    </g>
    <g class="quote-container" data-quote="12" opacity="0" style="animation-delay:77s">
      <text x="425" y="342" class="quote-text">“The only way to do great work is to love what you do.”</text>
      <text x="425" y="371" class="quote-author">— Steve Jobs</text>
    </g>
    <g class="quote-container" data-quote="13" opacity="0" style="animation-delay:84s">
      <text x="425" y="342" class="quote-text">“The function of good software is to make the complex appear simple.”</text>
      <text x="425" y="371" class="quote-author">— Grady Booch</text>
    </g>
    <g class="quote-container" data-quote="14" opacity="0" style="animation-delay:91s">
      <text x="425" y="342" class="quote-text">“Programs must be written for people to read.”</text>
      <text x="425" y="371" class="quote-author">— Harold Abelson</text>
    </g>
    <g class="quote-container" data-quote="15" opacity="0" style="animation-delay:98s">
      <text x="425" y="342" class="quote-text">“Any sufficiently advanced technology is indistinguishable from magic.”</text>
      <text x="425" y="371" class="quote-author">— Arthur C. Clarke</text>
    </g>
    <g class="quote-container" data-quote="16" opacity="0" style="animation-delay:105s">
      <text x="425" y="342" class="quote-text">“Make it work, make it right, make it fast.”</text>
      <text x="425" y="371" class="quote-author">— Kent Beck</text>
    </g>
    <g class="quote-container" data-quote="17" opacity="0" style="animation-delay:112s">
      <text x="425" y="342" class="quote-text">“The details are not the details. They make the design.”</text>
      <text x="425" y="371" class="quote-author">— Charles Eames</text>
    </g>
    <g class="quote-container" data-quote="18" opacity="0" style="animation-delay:119s">
      <text x="425" y="342" class="quote-text">“What I cannot create, I do not understand.”</text>
      <text x="425" y="371" class="quote-author">— Richard Feynman</text>
    </g>
    <g class="quote-container" data-quote="19" opacity="0" style="animation-delay:126s">
      <text x="425" y="342" class="quote-text">“Somewhere, something incredible is waiting to be known.”</text>
      <text x="425" y="371" class="quote-author">— Carl Sagan</text>
    </g>
    <g class="quote-container" data-quote="20" opacity="0" style="animation-delay:133s">
      <text x="425" y="342" class="quote-text">“There is no reason anyone would want a computer in their home.”</text>
      <text x="425" y="371" class="quote-author">— Ken Olsen</text>
    </g>
    <g class="quote-container" data-quote="21" opacity="0" style="animation-delay:140s">
      <text x="425" y="342" class="quote-text">“Design is not just what it looks like. Design is how it works.”</text>
      <text x="425" y="371" class="quote-author">— Steve Jobs</text>
    </g>
    <g class="quote-container" data-quote="22" opacity="0" style="animation-delay:147s">
      <text x="425" y="342" class="quote-text">“The best way to predict the future is to invent it.”</text>
      <text x="425" y="371" class="quote-author">— Alan Kay</text>
    </g>
    <g class="quote-container" data-quote="23" opacity="0" style="animation-delay:154s">
      <text x="425" y="342" class="quote-text">“The art challenges the technology, and the technology inspires the art.”</text>
      <text x="425" y="371" class="quote-author">— John Lasseter</text>
    </g>
    <g class="quote-container" data-quote="24" opacity="0" style="animation-delay:161s">
      <text x="425" y="342" class="quote-text">“Creativity is intelligence having fun.”</text>
      <text x="425" y="371" class="quote-author">— Albert Einstein</text>
    </g>
    <!-- QUOTES_END -->
  </g>
</svg>
